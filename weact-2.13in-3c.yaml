substitutions:
  sleep_time: 60min # daytime sleep
  low_battery_voltage: "3.30" # skip the fetch below this
  low_battery_sleep: 6h
  latitude: !secret latitude
  longitude: !secret longitude
  postalcode: !secret postalcode
  apikey: !secret apikey

esphome:
  name: weact-213in-3c-fuel-price
  friendly_name: weact-2.13in-3c-fuel-price
  name_add_mac_suffix: false
  includes:
    - utils.h
  on_boot:
    - priority: 900
      then:
        - lambda: |-
            id(wake_up_reason) = esp_sleep_get_wakeup_cause();
    - priority: -100
      then:
        - script.execute: wifi_give_up

deep_sleep:
  run_duration: 3min # backstop if deep_sleep.enter never runs
  sleep_duration: ${sleep_time}
  id: deep_sleep_1

esp32:
  variant: esp32
  framework:
    type: esp-idf

globals:
  - id: wake_up_reason
    type: int
    restore_value: no
    initial_value: '0'
  - id: fetch_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: should_refresh
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: cycle_done
    type: bool
    restore_value: no
    initial_value: 'false'
  # Last prices survive deep sleep so an unchanged board can skip the panel.
  - id: saved_diesel
    type: float
    restore_value: yes
    initial_value: '0'
  - id: saved_e5
    type: float
    restore_value: yes
    initial_value: '0'
  - id: saved_e10
    type: float
    restore_value: yes
    initial_value: '0'
  - id: saved_name_hash
    type: int
    restore_value: yes
    initial_value: '0'
  # Successful fetches with the same prices. Refresh is forced at 3.
  - id: wakes_since_refresh
    type: int
    restore_value: yes
    initial_value: '0'

# UART off while asleep-capable; API logs still work during the awake window.
logger:
  baud_rate: 0

# Enable Home Assistant API
api:
  reboot_timeout: 0s

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.0.246
  fast_connect:
    enabled: true
    storage: rtc
  power_save_mode: high
  post_connect_roaming: false
  reboot_timeout: 0s
  on_connect:
    then:
      - if:
          condition:
            lambda: 'return !id(cycle_done);'
          then:
            - logger.log: "WiFi connected, starting work"
            - script.execute: do_work

spi:
  clk_pin:
    number: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19 # Standard ESP32 hardware SPI

http_request:
  timeout: 10s

sensor:
  - platform: adc
    pin: GPIO34
    id: battery_voltage
    update_interval: never
    attenuation: auto
    filters: 
      - multiply: 2

  - platform: template
    name: "Battery Percentage"
    id: battery_percentage
    lambda: |-
      // tweak values in mapping for calibration
      // 4.1 = max voltage
      // 3.3 = min voltage
      float y = (id(battery_voltage).state - 3.3) * 100.0 / (4.1 - 3.3);
      if (y < 0.0) { return 0.0; }
      if (y < 100.0) { return y; } else { return 100.0; };
    update_interval: never

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Berlin"
    on_time_sync:
      then:
        - logger.log: "Synchronized system clock"

script:
  - id: wifi_give_up
    mode: single
    then:
      - delay: 45s
      - if:
          condition:
            or:
              - lambda: 'return id(cycle_done);'
              - script.is_running:
                  id: do_work
              - script.is_running:
                  id: enter_sleep
          then:
            - logger.log: "Work is underway, leaving the run_duration backstop"
          else:
            - if:
                condition:
                  wifi.connected:
                then:
                  - logger.log: "WiFi is up but work never started, starting it"
                  - script.execute: do_work
                else:
                  - logger.log: "WiFi did not connect, sleeping"
                  - script.execute: enter_sleep

  - id: do_work
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(cycle_done);'
          then:
            - logger.log: "Ignoring do_work, cycle already ending"
          else:
            - logger.log:
                format: "do_work start, wake=%d, wifi=%d"
                args: ['id(wake_up_reason)', 'id(wifi_id).is_connected()']
            - lambda: |-
                id(fetch_ok) = false;
                id(should_refresh) = false;
            - component.update: sntp_time
            - wait_until:
                condition:
                  time.has_time:
                    id: sntp_time
                timeout: 15s
            - component.update: battery_voltage
            - component.update: battery_percentage
            - if:
                condition:
                  lambda: |-
                    const float v = id(battery_voltage).state;
                    return !isnan(v) && v > 0.5f && v < ${low_battery_voltage}f;
                then:
                  - logger.log:
                      format: "Battery %.2f V is low, skipping fetch"
                      args: ['id(battery_voltage).state']
                  - script.execute: enter_sleep
                else:
                  - logger.log: "Getting fuel prices from API"
                  - http_request.get:
                      url: https://creativecommons.tankerkoenig.de/api/v4/stations/postalcode?apikey=${apikey}&postalcode=${postalcode}
                      request_headers:
                        Content-Type: application/json
                      capture_response: true
                      max_response_buffer_size: 16384
                      on_response:
                        then:
                          - logger.log:
                              format: "Response status: %d"
                              args: ['response->status_code']
                          - lambda: |-
                              id(fetch_ok) = false;
                              if (response->status_code != 200) {
                                return;
                              }
                              bool parsed = json::parse_json(body, [](JsonObject root) -> bool {
                                parseStationData(root);
                                return true;
                              });
                              id(fetch_ok) = parsed && bestStation.diesel_price > 0.0f && bestStation.diesel_price < 90.0f;
                      on_error:
                        then:
                          - logger.log: "HTTP request failed (connect/TLS/timeout)"
                  - if:
                      condition:
                        lambda: 'return id(fetch_ok);'
                      then:
                        - lambda: |-
                            RefreshPlan plan = planDisplayRefresh(
                                id(saved_diesel), id(saved_e5), id(saved_e10),
                                id(saved_name_hash), id(wakes_since_refresh));
                            id(saved_diesel) = plan.diesel;
                            id(saved_e5) = plan.e5;
                            id(saved_e10) = plan.e10;
                            id(saved_name_hash) = plan.name_hash;
                            id(wakes_since_refresh) = plan.wakes_since_refresh;
                            id(should_refresh) = plan.refresh;
                      else:
                        - logger.log: "Fetch failed, keeping the current image"
                  - if:
                      condition:
                        lambda: 'return id(should_refresh);'
                      then:
                        - if:
                            condition:
                              lambda: 'return id(wake_up_reason) == 4;'
                            then:
                              - logger.log: "Disabling WiFi before display refresh"
                              - wifi.disable:
                        - component.update: weact_display
                        - wait_until:
                            condition:
                              not:
                                epaper_spi.is_updating:
                                  id: weact_display
                            timeout: 40s
                      else:
                        - logger.log: "Skipping display refresh"
                        - if:
                            condition:
                              lambda: 'return id(wake_up_reason) == 4;'
                            then:
                              - wifi.disable:
                  - script.execute: enter_sleep

  - id: enter_sleep
    mode: single
    then:
      - lambda: 'id(cycle_done) = true;'
      - if:
          condition:
            and:
              # 4 is the timer. 0 is a fresh boot, 3 is a button. Keep Wi-Fi up so OTA can land.
              - lambda: 'return id(wake_up_reason) != 4;'
              - wifi.connected:
          then:
            - logger.log:
                format: "wake_up_reason: %d, waiting extra 25s"
                args: ['id(wake_up_reason)']
            - delay: 25s
      - if:
          condition:
            lambda: |-
              const float v = id(battery_voltage).state;
              return !isnan(v) && v > 0.5f && v < ${low_battery_voltage}f;
          then:
            - logger.log:
                format: "Battery %.2f V is low, sleeping ${low_battery_sleep}"
                args: ['id(battery_voltage).state']
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: ${low_battery_sleep}
          else:
            - if:
                condition:
                  and:
                    - time.has_time:
                        id: sntp_time
                    - lambda: 'return id(sntp_time).now().hour < 6;'
                then:
                  - logger.log: "It's nighttime, sleeping until 06:00"
                  - deep_sleep.enter:
                      id: deep_sleep_1
                      until: "06:00:00"
                      time_id: sntp_time
                else:
                  - logger.log: "It's daytime, sleeping for ${sleep_time}"
                  - deep_sleep.enter:
                      id: deep_sleep_1
                      sleep_duration: ${sleep_time}

font:
  - file: 'fonts/GoogleSans-Regular.ttf'
    id: font1
    size: 20
  - file: 'fonts/GoogleSans-Bold.ttf'
    id: font_bold
    size: 20
  - file: 'fonts/7segment.ttf'
    id: numbers
    size: 40

display:
  - id: weact_display
    platform: epaper_spi
    model: WeAct-2.13in-3c
    cs_pin: GPIO5
    dc_pin: GPIO17
    reset_pin: GPIO22
    busy_pin: GPIO4
    rotation: 0
    
    # WeAct Studio dimensions are 122x250 250x122, SSD1683
    dimensions:
      width: 122
      height: 250
      
    update_interval: never
    full_update_every: 1
    lambda: |-
      #define xres 122 
      #define yres 250

      int y = 0;
      
      const auto BLACK   = Color(0,   0,   0,   0);
      const auto WHITE   = Color(255, 255, 255, 0);
      const auto RED     = Color(255, 0, 0);

      it.fill(WHITE);   

      // Gas station name 
      it.printf(xres/2, y, id(font_bold), BLACK, TextAlign::TOP_CENTER,  "%s", bestStation.name);

      // Draw a line [0,y+5] to [xres,y+5]
      it.line(0, y+25, xres, y+25, BLACK);

      y = 30;

      it.rectangle(0, y, xres, 66, BLACK);

      it.print(2,y, id(font_bold), BLACK, TextAlign::TOP_LEFT, "Diesel");
      it.printf(xres/3.5, y+24, id(numbers), RED, "%.3f", bestStation.diesel_price);


      y+=65;

      it.rectangle(0, y, xres, 66, BLACK);

      it.print(2,y, id(font_bold), BLACK, TextAlign::TOP_LEFT, "Super E5");
      it.printf(xres/3.5, y+24, id(numbers), RED, "%.3f", bestStation.e5_price);
    
      y+=65;

      it.rectangle(0, y, xres, 65, BLACK);

      it.print(2,y, id(font_bold), BLACK, TextAlign::TOP_LEFT, "Super E10");
      it.printf(xres/3.5, y+24, id(numbers), RED, "%.3f", bestStation.e10_price);

      //fotter

      it.line(0, yres-22, xres, yres-22, BLACK);

      it.strftime(0, yres-23, id(font1), BLACK, TextAlign::TOP_LEFT, "%H:%M", id(sntp_time).now());
      it.printf(xres, yres-23, id(font1), BLACK, TextAlign::TOP_RIGHT, "%.2f,%.0f", id(battery_voltage).state,id(battery_percentage).state);
